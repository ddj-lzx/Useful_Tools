<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>The Ultimate LaTeX Analytical Engine - Final Precise Version</title>
    <script>
        window.MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true,
                // 集成所有已知数学库, 严谨性只增不减
                packages: {'[+]': ['base', 'ams', 'physics', 'boldsymbol', 'color', 'mathtools', 'mhchem', 'unicode', 'cases', 'extarrows']},
                tags: 'ams'
            },
            svg: { 
                fontCache: 'local',
                displayAlign: 'center',
                displayIndent: '0'
            },
            options: { renderActions: { addMenu: [] } }
        };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>
    <style>
        :root { --bg: #f0f2f5; --panel: #ffffff; --border: #cfd4db; --text: #1a1a1a; --primary: #0056b3; }
        
        body { 
            font-family: 'Times New Roman', serif, 'Microsoft YaHei'; 
            background: var(--bg); 
            margin: 0; 
            padding: 20px; 
            color: var(--text);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container { 
            width: 100%;
            max-width: 1200px; 
            background: var(--panel); 
            padding: 30px; 
            border-radius: 12px; 
            box-shadow: 0 12px 40px rgba(0,0,0,0.12); 
            box-sizing: border-box;
        }

        h1 { 
            text-align: center; 
            font-size: 2rem;
            margin-bottom: 25px;
            color: var(--primary);
            border-bottom: 2px solid var(--primary);
            padding-bottom: 10px;
        }
        
        textarea { 
            width: 100%; 
            height: 280px; 
            padding: 20px; 
            border: 2px solid var(--border); 
            border-radius: 8px; 
            font-family: 'Consolas', 'Monaco', monospace; 
            font-size: 16px; 
            box-sizing: border-box; 
            margin-bottom: 25px;
            transition: border-color 0.3s;
        }
        textarea:focus { border-color: var(--primary); outline: none; }

        .controls { 
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
        }

        button { 
            padding: 14px; 
            cursor: pointer; 
            border: none; 
            border-radius: 6px; 
            font-weight: bold; 
            font-size: 14px; 
            transition: all 0.2s;
            color: white;
            text-transform: uppercase;
        }

        .btn-clear { background: #dc3545; }
        .btn-png { background: #007bff; }
        .btn-jpg { background: #fd7e14; }
        .btn-svg { background: #28a745; }
        button:hover { opacity: 0.9; transform: translateY(-2px); }
        button:active { transform: translateY(0); }

        /* 预览区: 确保在网页端美观, 在手机端可滚动, 但导出时测度完整 */
        #preview-wrapper { 
            background: #ffffff; 
            border: 2px solid #e9ecef; 
            border-radius: 8px;
            padding: 40px; 
            overflow-x: auto; 
            min-height: 200px;
            position: relative;
        }
        
        #math-output { 
            width: 100%;
            min-width: min-content;
            line-height: 1.8;
            font-size: 20px;
            color: #000;
        }

        /* 严谨映射所有 LaTeX 样式算子 */
        .tex-title { font-size: 2.5em; font-weight: bold; text-align: center; margin-bottom: 15px; }
        .tex-author { font-size: 1.3em; text-align: center; margin-bottom: 10px; }
        .tex-date { font-size: 1.2em; text-align: center; margin-bottom: 35px; }
        .tex-section { font-size: 1.8em; font-weight: bold; margin-top: 30px; border-bottom: 1px solid #000; padding-bottom: 5px; }
        .tex-subsection { font-size: 1.5em; font-weight: bold; margin-top: 20px; }
        .tex-text { margin: 15px 0; text-indent: 2em; text-align: justify; }
        
        /* 列表与引用算子 */
        ol, ul { padding-left: 40px; margin: 15px 0; }
        li { margin-bottom: 8px; }
        blockquote { border-left: 5px solid var(--primary); padding: 10px 20px; margin: 20px 0; background: #f8f9fa; font-style: italic; }

        @media (max-width: 600px) {
            body { padding: 10px; }
            .container { padding: 15px; }
            #preview-wrapper { padding: 20px; }
            h1 { font-size: 1.5rem; }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>$\text{\LaTeX}$ Analytical Engine <small>vFinal</small></h1>
    
    <textarea id="latex-input" placeholder="请在此输入您的 LaTeX 源码." oninput="parseAndRender()"></textarea>

    <div class="controls">
        <button class="btn-clear" onclick="clearInput()">Clear</button>
        <button class="btn-png" onclick="downloadImage('png')">Download PNG</button>
        <button class="btn-jpg" onclick="downloadImage('jpg')">Download JPG</button>
        <button class="btn-svg" onclick="downloadVectorSVG()">Download SVG</button>
    </div>

    <div id="preview-wrapper">
        <div id="math-output"></div>
    </div>
</div>

<script>
    function parseAndRender() {
        const raw = document.getElementById('latex-input').value;
        const output = document.getElementById('math-output');

        if (!raw.trim()) {
            output.innerHTML = '';
            return;
        }

        let content = raw;

        // 1. 导言区自动过滤
        content = content.replace(/\\documentclass.*?\{.*?\}|\\usepackage.*?\{.*?\}|\\begin\{document\}|\\end\{document\}|(?<!\\)%.*/g, "");

        // 2. 状态算子映射: 标题,作者,日期
        let titleHtml = "";
        let t = content.match(/\\title\{([\s\S]*?)\}/);
        let a = content.match(/\\author\{([\s\S]*?)\}/);
        let d = content.match(/\\date\{([\s\S]*?)\}/);
        if(t) titleHtml += `<div class="tex-title">${t[1]}</div>`;
        if(a) titleHtml += `<div class="tex-author">${a[1]}</div>`;
        if(d) titleHtml += `<div class="tex-date">${d[1]}</div>`;
        
        content = content.replace(/\\title\{.*?\}/g, "").replace(/\\author\{.*?\}/g, "").replace(/\\date\{.*?\}/g, "");
        content = content.replace(/\\maketitle/g, titleHtml);

        // 3. 环境与结构化指令支持
        content = content.replace(/\\begin\{enumerate\}([\s\S]*?)\\end\{enumerate\}/g, (m, i) => `<ol>${i.split('\\item').filter(x=>x.trim()).map(x=>`<li>${x.trim()}</li>`).join('')}</ol>`);
        content = content.replace(/\\begin\{itemize\}([\s\S]*?)\\end\{itemize\}/g, (m, i) => `<ul>${i.split('\\item').filter(x=>x.trim()).map(x=>`<li>${x.trim()}</li>`).join('')}</ul>`);
        content = content.replace(/\\begin\{center\}([\s\S]*?)\\end\{center\}/g, '<div style="text-align:center">$1</div>');
        content = content.replace(/\\section\*?\{([\s\S]*?)\}/g, '<div class="tex-section">$1</div>');
        content = content.replace(/\\subsection\*?\{([\s\S]*?)\}/g, '<div class="tex-subsection">$1</div>');
        content = content.replace(/\\vspace\{([\s\S]*?)\}/g, '<div style="height:$1;"></div>');
        content = content.replace(/\\textbf\{([\s\S]*?)\}/g, '<strong>$1</strong>');
        content = content.replace(/\\textit\{([\s\S]*?)\}/g, '<em>$1</em>');
        content = content.replace(/\\underline\{([\s\S]*?)\}/g, '<span style="text-decoration:underline;">$1</span>');

        // 4. 换行与段落收敛逻辑
        content = content.replace(/\\\\/g, '<br/>');
        const paras = content.split(/\n\s*\n/);
        content = paras.map(p => {
            p = p.trim();
            if(!p) return '';
            let s = "";
            if(p.includes('\\noindent')) { s = ' style="text-indent:0;"'; p = p.replace(/\\noindent/g, ""); }
            const blocks = ['<div', '<ol', '<ul', '<blockquote'];
            if(blocks.some(b => p.startsWith(b))) return p;
            return `<div class="tex-text"${s}>${p}</div>`;
        }).join('');

        output.innerHTML = content;

        // 触发 MathJax 渲染算子
        clearTimeout(window.rt);
        window.rt = setTimeout(() => {
            MathJax.typesetPromise([output]).catch(e => console.error(e));
        }, 100);
    }

    function clearInput() {
        document.getElementById('latex-input').value = '';
        document.getElementById('math-output').innerHTML = '';
    }

    // ==================== 终极导出引擎: 解决截断与下载失败的核心 ====================
    async function generateSVGData() {
        const output = document.getElementById('math-output');
        if (!output || !output.innerText.trim()) { alert("Identity Error: No content found."); return null; }

        // 关键步骤: 强制测量全量高度, 绕过视口限制
        const width = Math.max(output.scrollWidth, 800); 
        const height = output.scrollHeight;

        let styles = "";
        for (const sheet of document.styleSheets) {
            try { for (const rule of sheet.cssRules) styles += rule.cssText; } catch (e) {}
        }

        // 构造自包含的矢量算子容器
        const svgString = `
            <svg xmlns="http://www.w3.org/2000/svg" width="${width}" height="${height}">
                <foreignObject width="100%" height="100%">
                    <div xmlns="http://www.w3.org/1999/xhtml" style="background:white; padding:40px; margin:0; box-sizing:border-box;">
                        <style>${styles} #math-output { width: 100% !important; min-width: unset !important; }</style>
                        ${output.innerHTML}
                    </div>
                </foreignObject>
            </svg>`;

        try {
            const base64SVG = "data:image/svg+xml;base64," + btoa(unescape(encodeURIComponent(svgString)));
            return { url: base64SVG, width, height, raw: svgString };
        } catch (e) {
            alert("Calculation Error: Complex structure detected.");
            return null;
        }
    }

    async function downloadImage(format) {
        const data = await generateSVGData();
        if (!data) return;

        const img = new Image();
        img.crossOrigin = "anonymous";
        img.onload = function() {
            const canvas = document.createElement('canvas');
            const scale = 4; // 4倍高斯采样, 极致清晰
            canvas.width = data.width * scale;
            canvas.height = data.height * scale;
            const ctx = canvas.getContext('2d');
            
            ctx.fillStyle = "white";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

            const link = document.createElement('a');
            link.download = `Rigorous_Solution_${Date.now()}.${format}`;
            link.href = canvas.toDataURL(format === 'png' ? 'image/png' : 'image/jpeg', 1.0);
            link.click();
        };
        img.src = data.url;
    }

    async function downloadVectorSVG() {
        const data = await generateSVGData();
        if (!data) return;
        const blob = new Blob([data.raw], {type: 'image/svg+xml;charset=utf-8'});
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = url;
        link.download = `Rigorous_Vector_Graph_${Date.now()}.svg`;
        link.click();
        URL.revokeObjectURL(url);
    }
</script>

</body>
</html>
