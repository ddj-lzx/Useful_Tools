<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>24点计算器</title>
</head>
<body>
    <h1>24点游戏判断程序</h1>
    <div>输入4个数字，程序会判断能否算出24点并给出算法</div>
    
    <hr>
    
    <div>
        <h2>请选择：</h2>
        <div>
            <button onclick="showInputSection()">1. 输入4个数字判断</button>
            <button onclick="testClassicCases()">2. 测试经典案例</button>
            <button onclick="clearAll()">3. 清空</button>
        </div>
    </div>
    
    <hr>
    
    <div id="inputSection" style="display:none;">
        <h3>输入4个数字</h3>
        <div>
            <input type="number" id="num1" placeholder="数字1">
            <input type="number" id="num2" placeholder="数字2">
            <input type="number" id="num3" placeholder="数字3">
            <input type="number" id="num4" placeholder="数字4">
        </div>
        <div>
            <button onclick="calculateFromInput()">计算</button>
            <button onclick="clearInput()">清空输入</button>
        </div>
        <div id="inputError" style="color:red;"></div>
    </div>
    
    <hr>
    
    <div id="resultSection" style="display:none;">
        <h3>计算结果</h3>
        <div id="resultNumbers"></div>
        <div id="resultCount"></div>
        <div id="solutionsList"></div>
    </div>
    
    <script>
        // 生成数字的所有排列
        function permutations(arr) {
            if (arr.length <= 1) return [arr];
            let result = [];
            for (let i = 0; i < arr.length; i++) {
                let rest = [...arr.slice(0, i), ...arr.slice(i + 1)];
                let perms = permutations(rest);
                for (let perm of perms) {
                    result.push([arr[i], ...perm]);
                }
            }
            return result;
        }
        
        // 判断4个数字能否算出24点，并给出所有可能的算法
        function calculate24(numbers) {
            let solutions = [];
            let operators = ['+', '-', '*', '/'];
            
            // 获取数字的所有排列
            let perms = permutations(numbers);
            
            for (let perm of perms) {
                let [a, b, c, d] = perm;
                
                // 尝试所有运算符组合
                for (let op1 of operators) {
                    for (let op2 of operators) {
                        for (let op3 of operators) {
                            // 尝试不同的括号组合方式
                            let expressions = [
                                `((${a} ${op1} ${b}) ${op2} ${c}) ${op3} ${d}`,  // ((a op b) op c) op d
                                `(${a} ${op1} (${b} ${op2} ${c})) ${op3} ${d}`,  // (a op (b op c)) op d
                                `(${a} ${op1} ${b}) ${op2} (${c} ${op3} ${d})`,  // (a op b) op (c op d)
                                `${a} ${op1} ((${b} ${op2} ${c}) ${op3} ${d})`,  // a op ((b op c) op d)
                                `${a} ${op1} (${b} ${op2} (${c} ${op3} ${d}))`   // a op (b op (c op d))
                            ];
                            
                            for (let expr of expressions) {
                                try {
                                    // 计算表达式的值
                                    let result = eval(expr);
                                    // 判断是否等于24(考虑浮点数误差)
                                    if (Math.abs(result - 24) < 0.0001) {
                                        // 避免重复解
                                        let exprStr = expr.toString();
                                        if (!solutions.includes(exprStr)) {
                                            solutions.push(exprStr);
                                        }
                                    }
                                } catch (e) {
                                    // 忽略除零错误等
                                    continue;
                                }
                            }
                        }
                    }
                }
            }
            
            return solutions;
        }
        
        // 简化和去重解法
        function simplifySolutions(solutions) {
            let unique = [];
            let seen = new Set();
            
            for (let sol of solutions) {
                // 移除空格进行比较
                let normalized = sol.replace(/\s+/g, '');
                if (!seen.has(normalized)) {
                    seen.add(normalized);
                    unique.push(sol);
                }
            }
            
            return unique;
        }
        
        // 显示输入区域
        function showInputSection() {
            document.getElementById('inputSection').style.display = 'block';
            document.getElementById('resultSection').style.display = 'none';
            document.getElementById('inputError').innerHTML = '';
            clearInput();
        }
        
        // 从输入计算
        function calculateFromInput() {
            let num1 = document.getElementById('num1').value;
            let num2 = document.getElementById('num2').value;
            let num3 = document.getElementById('num3').value;
            let num4 = document.getElementById('num4').value;
            
            let errorElem = document.getElementById('inputError');
            
            // 验证输入
            if (!num1 || !num2 || !num3 || !num4) {
                errorElem.innerHTML = "错误: 必须输入4个数字!";
                return;
            }
            
            let numbers = [parseFloat(num1), parseFloat(num2), parseFloat(num3), parseFloat(num4)];
            
            // 开始计算
            let solutions = calculate24(numbers);
            solutions = simplifySolutions(solutions);
            
            // 显示结果
            document.getElementById('resultSection').style.display = 'block';
            document.getElementById('resultNumbers').innerHTML = `<strong>数字: ${numbers.join(', ')}</strong>`;
            
            if (solutions.length > 0) {
                document.getElementById('resultCount').innerHTML = `✓ 可以算出24点! 共找到 ${solutions.length} 种解法:`;
                
                let solutionsHtml = '';
                for (let i = 0; i < solutions.length; i++) {
                    solutionsHtml += `<div>${i+1}. ${solutions[i]} = 24</div>`;
                }
                document.getElementById('solutionsList').innerHTML = solutionsHtml;
            } else {
                document.getElementById('resultCount').innerHTML = "✗ 这4个数字无法算出24点";
                document.getElementById('solutionsList').innerHTML = '';
            }
            
            errorElem.innerHTML = '';
        }
        
        // 测试经典案例
        function testClassicCases() {
            let testCases = [
                [3, 3, 8, 8],   // 经典难题
                [1, 1, 1, 1],   // 无解
                [1, 5, 5, 5],   // 简单
                [4, 4, 10, 10], // 中等
                [2, 3, 4, 5],   // 简单
            ];
            
            // 只显示第一个案例的结果
            let numbers = testCases[0];
            let solutions = calculate24(numbers);
            solutions = simplifySolutions(solutions);
            
            // 显示结果
            document.getElementById('inputSection').style.display = 'none';
            document.getElementById('resultSection').style.display = 'block';
            document.getElementById('resultNumbers').innerHTML = `<strong>经典案例测试: ${numbers.join(', ')}</strong>`;
            
            if (solutions.length > 0) {
                document.getElementById('resultCount').innerHTML = `✓ 可以算出24点! 共找到 ${solutions.length} 种解法(显示前3种):`;
                
                let solutionsHtml = '';
                let displayCount = Math.min(solutions.length, 3);
                for (let i = 0; i < displayCount; i++) {
                    solutionsHtml += `<div>${i+1}. ${solutions[i]} = 24</div>`;
                }
                document.getElementById('solutionsList').innerHTML = solutionsHtml;
            } else {
                document.getElementById('resultCount').innerHTML = "✗ 这4个数字无法算出24点";
                document.getElementById('solutionsList').innerHTML = '';
            }
        }
        
        // 清空输入
        function clearInput() {
            document.getElementById('num1').value = '';
            document.getElementById('num2').value = '';
            document.getElementById('num3').value = '';
            document.getElementById('num4').value = '';
            document.getElementById('inputError').innerHTML = '';
        }
        
        // 清空所有
        function clearAll() {
            document.getElementById('inputSection').style.display = 'none';
            document.getElementById('resultSection').style.display = 'none';
            clearInput();
        }
    </script>
</body>
</html>
