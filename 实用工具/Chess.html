<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>高级国际象棋 AI - 单机版</title>
    
    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
    
    <style>
        :root {
            --bg-color: #2c3e50;
            --panel-color: #34495e;
            --text-color: #ecf0f1;
            --accent-color: #e67e22;
            --board-border: #95a5a6;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }

        h1 { margin-bottom: 10px; font-weight: 300; }

        .container {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: center;
            padding: 20px;
            background: rgba(0,0,0,0.2);
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        /* 棋盘区域 */
        #myBoard {
            width: 400px; /* 默认宽度，移动端可自适应 */
            border: 5px solid var(--board-border);
            border-radius: 4px;
        }

        /* 控制面板 */
        .controls {
            width: 300px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .panel-box {
            background-color: var(--panel-color);
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .status-box {
            font-size: 1.1em;
            font-weight: bold;
            color: var(--accent-color);
        }

        label { display: block; margin-bottom: 5px; font-size: 0.9em; color: #bdc3c7; }
        
        select, button {
            width: 100%;
            padding: 10px;
            border: none;
            border-radius: 5px;
            margin-bottom: 5px;
            font-size: 1em;
            cursor: pointer;
            transition: all 0.2s;
        }

        select { background: #fff; color: #333; }
        
        button {
            background-color: #2980b9;
            color: white;
            font-weight: bold;
        }

        button:hover { background-color: #3498db; }
        button.secondary { background-color: #7f8c8d; }
        button.secondary:hover { background-color: #95a5a6; }
        
        /* 移动记录 */
        #pgn {
            font-family: monospace;
            font-size: 0.85em;
            height: 100px;
            overflow-y: auto;
            background: rgba(0,0,0,0.3);
            padding: 10px;
            border-radius: 5px;
            word-wrap: break-word;
        }

        /* 加载/思考指示器 */
        #thinking {
            display: none;
            color: #f1c40f;
            font-style: italic;
            animation: blink 1s infinite;
        }

        @keyframes blink { 50% { opacity: 0.5; } }

        @media (max-width: 768px) {
            #myBoard { width: 90vw; }
            .container { flex-direction: column; align-items: center; }
            .controls { width: 90vw; }
        }
    </style>
</head>
<body>

    <h1>♟️ 国际象棋大师 AI</h1>

    <div class="container">
        <div id="myBoard"></div>

        <div class="controls">
            
            <div class="panel-box">
                <label>游戏状态</label>
                <div id="status" class="status-box">准备就绪</div>
                <div id="thinking">AI 正在思考...</div>
            </div>

            <div class="panel-box">
                <label>AI 难度</label>
                <select id="difficulty">
                    <option value="0">猴子 (随机移动)</option>
                    <option value="1">初学者 (Depth 1)</option>
                    <option value="2" selected>业余 (Depth 2)</option>
                    <option value="3">专家 (Depth 3+Eval)</option>
                </select>

                <label>玩家执子</label>
                <select id="orientation">
                    <option value="white">执白 (White)</option>
                    <option value="black">执黑 (Black)</option>
                </select>

                <button onclick="newGame()">开始新游戏</button>
            </div>

            <div class="panel-box">
                <button class="secondary" onclick="board.flip()">🔄 旋转棋盘</button>
                <button class="secondary" onclick="undoMove()">↩️ 悔棋</button>
            </div>

            <div class="panel-box">
                <label>FEN (当前局面代码)</label>
                <input type="text" id="fen" style="width:90%; font-size:0.8em; padding:5px;" readonly>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>

    <script>
        // --- 1. 游戏配置与变量 ---
        var board = null;
        var game = new Chess();
        var $status = $('#status');
        var $fen = $('#fen');
        var $pgn = $('#pgn');
        var $thinking = $('#thinking');
        var currentDifficulty = 2; // 默认业余
        
        // --- 2. AI 评估核心 (Minimax + PST) ---
        // AI 权重值
        var weights = { p: 100, n: 320, b: 330, r: 500, q: 900, k: 20000 };
        
        // 位置评估表 (Piece-Square Tables) - 简化版
        // 鼓励AI占领中心，鼓励兵推进，鼓励骑士跳向中心
        var pst = {
            p: [ [100, 100, 100, 100, 105, 100, 100,  100],
                 [78,  83,  86,  73,  102, 82,  85,  90],
                 [7,   29,  21,  44,  40,  31,  44,  7],
                 [-17, 16,  -2,  15,  14,  0,   15, -13],
                 [-26, 3,   10,  9,   6,   1,   -5, -19],
                 [-22, 9,   5,   -11, -10, -2,  3,  -19],
                 [-31, 8,   -7,  -37, -36, -14, 3,  -31],
                 [0,   0,   0,   0,   0,   0,   0,   0] ],
            n: [ [-66, -53, -75, -75, -10, -55, -58, -70],
                 [-3,  -6,  100, -36, 4,   62,  -4,  -14],
                 [10,  67,  1,   74,  73,  27,  62,  -2],
                 [24,  24,  45,  37,  33,  41,  25,  17],
                 [-1,  5,   31,  21,  22,  35,  2,   0],
                 [-18, 10,  13,  22,  18,  15,  11,  -14],
                 [-23, -15, 2,   0,   2,   0,   -23, -20],
                 [-74, -23, -26, -24, -19, -35, -22, -69] ],
            b: [ [-59, -78, -82, -76, -23, -107, -37, -50],
                 [-11, 20,  35,  -42, -39, 31,   2,   -22],
                 [-9,  39,  -32, 41,  52,  -10,  28,  -14],
                 [25,  17,  20,  34,  26,  25,   15,  10],
                 [13,  10,  17,  23,  17,  16,   0,   7],
                 [14,  25,  24,  15,  8,   25,   20,  15],
                 [19,  20,  11,  6,   7,   6,    20,  16],
                 [-7,  2,   -15, -12, -14, -15,  -10, -10] ],
            r: [ [35,  29,  33,  4,   37,  33,  56,  50],
                 [55,  29,  56,  67,  55,  62,  34,  60],
                 [19,  35,  28,  33,  45,  27,  25,  15],
                 [0,   5,   16,  13,  18,  -4,  -9,  -6],
                 [-28, -35, -16, -21, -13, -29, -46, -30],
                 [-42, -28, -42, -25, -25, -35, -26, -46],
                 [-53, -38, -31, -26, -29, -43, -44, -53],
                 [-30, -24, -18, -5,  -2,  -18, -31, -32] ],
            q: [ [6,   1,   -8, -104, 69,  24,  88,  26],
                 [14,  32,  60, -10,  20,  76,  57,  24],
                 [-2,  43,  32, 60,   72,  63,  43,  2],
                 [1,   -16, 22, 17,   25,  20,  -13, -6],
                 [-14, -15, -2, -5,   -1,  -10, -20, -22],
                 [-30, -6,  -13, -11, -16, -11, -16, -27],
                 [-36, -18, 0,  -19,  -15, -15, -21, -38],
                 [-39, -30, -9, -13,  -31, -36, -34, -42] ],
            k: [ [4,   54,  47, -99, -99, 60,  83,  -62],
                 [-32, 10,  55, 56,  56,  55,  10,  -32],
                 [-62, 12,  -57, 44, -67, 28,  37,  -31],
                 [-55, 29,  11,  22,  -2,  58,  28,  -55],
                 [-55, 22,  27,  -5,  -16, 14,  -21, -55],
                 [-45, -82, -18, -13, -23, -71, -19, -35],
                 [-44, -50, -2,  -35, -20, -26, -53, -29],
                 [-17, -13, -4,  -23, -25, -9,  -12, -10] ]
        };

        // 评估函数：计算当前盘面对某一方的分数
        function evaluateBoard(game, color) {
            var totalEvaluation = 0;
            var board = game.board();

            for (var i = 0; i < 8; i++) {
                for (var j = 0; j < 8; j++) {
                    var piece = board[i][j];
                    if (piece) {
                        var isWhite = piece.color === 'w';
                        // 基础分
                        var baseVal = weights[piece.type];
                        // 位置分 (注意：黑色需要翻转索引)
                        var pstVal = 0;
                        if (isWhite) {
                            pstVal = pst[piece.type][i][j];
                        } else {
                            pstVal = pst[piece.type][7 - i][j]; // 简单的翻转，实际应用可优化
                        }

                        var absVal = baseVal + pstVal;
                        totalEvaluation += isWhite ? absVal : -absVal;
                    }
                }
            }
            // 返回相对于当前行动方的分数
            return color === 'w' ? totalEvaluation : -totalEvaluation;
        }

        // Minimax 算法 + Alpha-Beta 剪枝
        function minimax(game, depth, alpha, beta, isMaximizingPlayer, playerColor) {
            if (depth === 0 || game.game_over()) {
                return evaluateBoard(game, playerColor);
            }

            var newGameMoves = game.moves();

            if (isMaximizingPlayer) {
                var bestEval = -99999;
                for (var i = 0; i < newGameMoves.length; i++) {
                    game.move(newGameMoves[i]);
                    var eval = minimax(game, depth - 1, alpha, beta, false, playerColor);
                    game.undo();
                    bestEval = Math.max(bestEval, eval);
                    alpha = Math.max(alpha, eval);
                    if (beta <= alpha) {
                        return bestEval;
                    }
                }
                return bestEval;
            } else {
                var bestEval = 99999;
                for (var i = 0; i < newGameMoves.length; i++) {
                    game.move(newGameMoves[i]);
                    var eval = minimax(game, depth - 1, alpha, beta, true, playerColor);
                    game.undo();
                    bestEval = Math.min(bestEval, eval);
                    beta = Math.min(beta, eval);
                    if (beta <= alpha) {
                        return bestEval;
                    }
                }
                return bestEval;
            }
        }

        // 计算最佳移动
        function makeBestMove() {
            var possibleMoves = game.moves();
            if (possibleMoves.length === 0) return;

            // 难度 0: 随机
            if (currentDifficulty == 0) {
                var randomIdx = Math.floor(Math.random() * possibleMoves.length);
                game.move(possibleMoves[randomIdx]);
                board.position(game.fen());
                updateStatus();
                return;
            }

            var bestMove = null;
            var bestValue = -99999;
            var depth = parseInt(currentDifficulty); // 1, 2, or 3

            // 为了增加随机性，避免AI每次开局都完全一样，可以打乱一下移动顺序
            possibleMoves.sort(() => Math.random() - 0.5);

            var playerColor = game.turn(); // AI 的颜色

            // 根节点的搜索
            for (var i = 0; i < possibleMoves.length; i++) {
                var move = possibleMoves[i];
                game.move(move);
                // 这里调用 minimax
                var boardValue = minimax(game, depth - 1, -100000, 100000, false, playerColor);
                game.undo();

                if (boardValue > bestValue) {
                    bestValue = boardValue;
                    bestMove = move;
                }
            }

            game.move(bestMove);
            board.position(game.fen());
            updateStatus();
        }


        // --- 3. 游戏交互逻辑 ---

        function onDragStart(source, piece, position, orientation) {
            // 游戏结束不能拖动
            if (game.game_over()) return false;

            // 只能拖动己方的棋子
            var playerColor = $('#orientation').val().charAt(0); // 'w' or 'b'
            
            // 如果轮到玩家走，且拖动的是玩家颜色的棋子
            if (game.turn() === playerColor && piece.search(playerColor) !== -1) {
                return true;
            }
            return false;
        }

        function onDrop(source, target) {
            // 尝试移动
            var move = game.move({
                from: source,
                to: target,
                promotion: 'q' // 为了简化，默认升变为后 (严谨的程序会弹窗，但为了单文件体验这里做折中)
            });

            // 非法移动，棋子弹回
            if (move === null) return 'snapback';

            updateStatus();

            // 如果游戏没结束，触发 AI
            if (!game.game_over()) {
                // 延迟一下，让玩家看到自己的棋子落下
                $thinking.css('display', 'block');
                window.setTimeout(function() {
                    makeBestMove();
                    $thinking.css('display', 'none');
                }, 250);
            }
        }

        function onSnapEnd() {
            // 更新棋盘位置（处理王车易位、过路兵等复杂移动后的位置同步）
            board.position(game.fen());
        }

        function updateStatus() {
            var status = '';
            var moveColor = (game.turn() === 'b') ? '黑方 (Black)' : '白方 (White)';

            // 检查游戏结束状态
            if (game.in_checkmate()) {
                status = '游戏结束，' + moveColor + ' 被将死。';
            } else if (game.in_draw()) {
                status = '游戏结束，和局。';
            } else {
                status = moveColor + ' 走棋';
                if (game.in_check()) {
                    status += ' (被将军!)';
                }
            }

            $status.html(status);
            $fen.val(game.fen());
        }

        // --- 4. 按钮与设置逻辑 ---

        function newGame() {
            game.reset();
            var orientation = $('#orientation').val();
            board.orientation(orientation);
            board.position(game.fen());
            currentDifficulty = $('#difficulty').val();
            updateStatus();

            // 如果玩家选黑方，AI (白方) 先走
            if (orientation === 'black') {
                 $thinking.css('display', 'block');
                window.setTimeout(function() {
                    makeBestMove(); // 白方(AI)先走一步
                    $thinking.css('display', 'none');
                }, 500);
            }
        }

        function undoMove() {
            // 悔棋需要退两步（玩家一步，AI一步）
            game.undo(); // 撤销 AI
            game.undo(); // 撤销 玩家
            board.position(game.fen());
            updateStatus();
        }

        // --- 5. 初始化 ---
        var config = {
            draggable: true,
            position: 'start',
            onDragStart: onDragStart,
            onDrop: onDrop,
            onSnapEnd: onSnapEnd,
            pieceTheme: 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png'
        };
        
        board = Chessboard('myBoard', config);
        updateStatus();

        // 监听设置变化
        $('#difficulty').on('change', function() {
            currentDifficulty = this.value;
        });

    </script>
</body>
</html>
