<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>质数判断程序</title>
</head>
<body>
    <h1>质数判断程序</h1>
    
    <div>
        <h2>请选择功能：</h2>
        <div>
            <button onclick="showRangePrimes()">1. 列举范围内所有质数</button>
            <button onclick="showSingleCheck()">2. 判断单个数字是否是质数</button>
            <button onclick="showMultiCheck()">3. 判断一组数字是否是质数</button>
            <button onclick="clearAll()">4. 清空</button>
        </div>
    </div>
    
    <hr>
    
    <div id="rangeSection" style="display:none;">
        <h3>列举范围内所有质数</h3>
        <div>
            起始数字: <input type="number" id="startNum" value="1">
            结束数字: <input type="number" id="endNum" value="100">
        </div>
        <div>
            <button onclick="calculateRangePrimes()">计算</button>
            <button onclick="clearRange()">清空</button>
        </div>
        <div id="rangeResult"></div>
    </div>
    
    <div id="singleSection" style="display:none;">
        <h3>判断单个数字是否是质数</h3>
        <div>
            数字: <input type="number" id="singleNum" value="17">
        </div>
        <div>
            <button onclick="checkSinglePrime()">判断</button>
            <button onclick="clearSingle()">清空</button>
        </div>
        <div id="singleResult"></div>
    </div>
    
    <div id="multiSection" style="display:none;">
        <h3>判断一组数字是否是质数</h3>
        <div>
            输入多个数字，用空格分隔 (例如: 2 3 5 7 11)
        </div>
        <div>
            <input type="text" id="multiNums" value="2 3 5 7 11" style="width:300px;">
        </div>
        <div>
            <button onclick="checkMultiPrimes()">判断</button>
            <button onclick="clearMulti()">清空</button>
        </div>
        <div id="multiResult"></div>
    </div>
    
    <script>
        // 判断单个数字是否是质数
        function isPrime(n) {
            // 小于2的数不是质数
            if (n < 2) {
                return false;
            }
            
            // 2是质数
            if (n === 2) {
                return true;
            }
            
            // 偶数不是质数
            if (n % 2 === 0) {
                return false;
            }
            
            // 只需要检查到平方根即可
            let i = 3;
            while (i * i <= n) {
                if (n % i === 0) {
                    return false;
                }
                i += 2;  // 只检查奇数
            }
            
            return true;
        }
        
        // 判断一组数字是否是质数，逐一回复true/false
        function checkPrimes(numbers) {
            let result = "=== 质数判断结果 ===<br>";
            for (let num of numbers) {
                let primeResult = isPrime(num);
                result += `${num}: ${primeResult}<br>`;
            }
            return result;
        }
        
        // 列举出范围内的所有质数
        function getRangePrimes(start, end) {
            let primes = [];
            
            for (let num = start; num <= end; num++) {
                if (isPrime(num)) {
                    primes.push(num);
                }
            }
            
            return primes;
        }
        
        // 显示列举范围内所有质数的界面
        function showRangePrimes() {
            document.getElementById('rangeSection').style.display = 'block';
            document.getElementById('singleSection').style.display = 'none';
            document.getElementById('multiSection').style.display = 'none';
            clearAllResults();
        }
        
        // 显示判断单个数字的界面
        function showSingleCheck() {
            document.getElementById('rangeSection').style.display = 'none';
            document.getElementById('singleSection').style.display = 'block';
            document.getElementById('multiSection').style.display = 'none';
            clearAllResults();
        }
        
        // 显示判断一组数字的界面
        function showMultiCheck() {
            document.getElementById('rangeSection').style.display = 'none';
            document.getElementById('singleSection').style.display = 'none';
            document.getElementById('multiSection').style.display = 'block';
            clearAllResults();
        }
        
        // 计算范围内的质数
        function calculateRangePrimes() {
            let start = parseInt(document.getElementById('startNum').value);
            let end = parseInt(document.getElementById('endNum').value);
            
            if (isNaN(start) || isNaN(end)) {
                document.getElementById('rangeResult').innerHTML = "请输入有效的数字";
                return;
            }
            
            if (start > end) {
                document.getElementById('rangeResult').innerHTML = "起始数字不能大于结束数字";
                return;
            }
            
            let primes = getRangePrimes(start, end);
            let result = `=== ${start} 到 ${end} 之间的所有质数 ===<br>`;
            
            if (primes.length > 0) {
                result += `找到 ${primes.length} 个质数:<br>`;
                result += primes.join(', ');
            } else {
                result += "在此范围内没有质数";
            }
            
            document.getElementById('rangeResult').innerHTML = result;
        }
        
        // 判断单个数字
        function checkSinglePrime() {
            let num = parseInt(document.getElementById('singleNum').value);
            
            if (isNaN(num)) {
                document.getElementById('singleResult').innerHTML = "请输入有效的数字";
                return;
            }
            
            let result = isPrime(num);
            let output = `${num}: ${result}<br>`;
            
            if (result) {
                output += `${num} 是质数`;
            } else {
                output += `${num} 不是质数`;
            }
            
            document.getElementById('singleResult').innerHTML = output;
        }
        
        // 判断一组数字
        function checkMultiPrimes() {
            let numsStr = document.getElementById('multiNums').value.trim();
            
            if (!numsStr) {
                document.getElementById('multiResult').innerHTML = "请输入数字";
                return;
            }
            
            // 分割字符串并转换为数字
            let numsArray = numsStr.split(/\s+/);
            let numbers = [];
            
            for (let numStr of numsArray) {
                let num = parseFloat(numStr);
                if (!isNaN(num)) {
                    numbers.push(num);
                }
            }
            
            if (numbers.length === 0) {
                document.getElementById('multiResult').innerHTML = "没有找到有效的数字";
                return;
            }
            
            let result = checkPrimes(numbers);
            document.getElementById('multiResult').innerHTML = result;
        }
        
        // 清空范围部分
        function clearRange() {
            document.getElementById('startNum').value = '1';
            document.getElementById('endNum').value = '100';
            document.getElementById('rangeResult').innerHTML = '';
        }
        
        // 清空单个数字部分
        function clearSingle() {
            document.getElementById('singleNum').value = '17';
            document.getElementById('singleResult').innerHTML = '';
        }
        
        // 清空多个数字部分
        function clearMulti() {
            document.getElementById('multiNums').value = '2 3 5 7 11';
            document.getElementById('multiResult').innerHTML = '';
        }
        
        // 清空所有结果
        function clearAllResults() {
            document.getElementById('rangeResult').innerHTML = '';
            document.getElementById('singleResult').innerHTML = '';
            document.getElementById('multiResult').innerHTML = '';
        }
        
        // 清空所有
        function clearAll() {
            document.getElementById('rangeSection').style.display = 'none';
            document.getElementById('singleSection').style.display = 'none';
            document.getElementById('multiSection').style.display = 'none';
            clearAllResults();
        }
    </script>
</body>
</html>
