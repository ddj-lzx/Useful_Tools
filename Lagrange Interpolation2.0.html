<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Analytical Law Solver - Rigorous Version</title>
    <style>
        :root {
            --primary: #007AFF;
            --bg: #F2F2F7;
            --card-bg: #FFFFFF;
            --text-main: #1D1D1F;
            --border: #E5E5EA;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            margin: 0;
        }

        .main-card {
            background: var(--card-bg);
            width: 100%;
            max-width: 650px;
            border-radius: 20px;
            padding: 35px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.05);
            box-sizing: border-box;
        }

        h2 {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 25px;
            text-align: center;
            letter-spacing: -0.02em;
        }

        .input-wrapper { margin-bottom: 20px; }

        input[type="text"] {
            width: 100%;
            padding: 18px;
            font-size: 17px;
            border: 2px solid var(--border);
            border-radius: 12px;
            background: #FAFAFA;
            outline: none;
            transition: all 0.2s;
            text-align: center;
            box-sizing: border-box;
        }

        input[type="text"]:focus {
            border-color: var(--primary);
            background: #FFF;
            box-shadow: 0 0 0 4px rgba(0, 122, 255, 0.1);
        }

        .btn-group { display: flex; gap: 10px; }

        button {
            flex: 1;
            padding: 16px;
            background-color: var(--primary);
            color: white;
            font-size: 16px;
            font-weight: 600;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s;
        }

        button:active { transform: scale(0.98); }
        .btn-copy { background-color: #34C759; }

        #result-area {
            margin-top: 25px;
            padding: 20px;
            background-color: #F8F8FA;
            border-radius: 12px;
            border: 1px solid var(--border);
            font-family: "SF Mono", "Fira Code", monospace;
            font-size: 14px;
            line-height: 1.6;
            display: none;
            white-space: pre-wrap;
            word-break: break-all;
        }

        .status-msg {
            margin-top: 10px;
            font-size: 12px;
            color: #8E8E93;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="main-card">
        <h2>Discrete Sequence Analytical Solver</h2>
        <h6>Use '#' to separate the numbers.</h6>
        <div class="input-wrapper">
            <input type="text" id="numsInput" placeholder="Enter numbers." autocomplete="off">
        </div>
        <div class="btn-group">
            <button onclick="computeAndOutput()">Solve Law</button>
            <button class="btn-copy" onclick="copyToClipboard()">Copy LaTeX</button>
        </div>
        <div id="result-area"></div>
        <p class="status-msg">Precision: Exact Rational Arithmetic (BigInt). All punctuation is standard English.</p>
    </div>

    <script>
        class Fraction {
            constructor(n, d = 1n) {
                if (d === 0n) throw new Error("Division by zero");
                if (d < 0n) { n = -n; d = -d; }
                const common = this.gcd(n < 0n ? -n : n, d);
                this.n = n / common;
                this.d = d / common;
            }
            gcd(a, b) { return b === 0n ? a : this.gcd(b, a % b); }
            add(o) { return new Fraction(this.n * o.d + o.n * this.d, this.d * o.d); }
            sub(o) { return new Fraction(this.n * o.d - o.n * this.d, this.d * o.d); }
            mul(o) { return new Fraction(this.n * o.n, this.d * o.d); }
            div(o) { return new Fraction(this.n * o.d, this.d * o.n); }

            static parse(str) {
                str = str.trim();
                if (!str) return null;
                try {
                    if (str.includes('/')) {
                        const p = str.split('/');
                        return new Fraction(BigInt(p[0]), BigInt(p[1]));
                    }
                    if (str.includes('.')) {
                        const p = str.split('.');
                        const numerator = BigInt(p[0] + p[1]);
                        const denominator = 10n ** BigInt(p[1].length);
                        return new Fraction(numerator, denominator);
                    }
                    return new Fraction(BigInt(str));
                } catch (e) { return null; }
            }

            toLaTeX(isFirst, power) {
                if (this.n === 0n) return "";
                let s = "";
                const absN = this.n < 0n ? -this.n : this.n;
                if (this.n < 0n) s += isFirst ? "-" : " - ";
                else if (!isFirst) s += " + ";
                let valStr = "";
                if (this.d === 1n) {
                    if (power === 0 || absN !== 1n) valStr = absN.toString();
                } else {
                    valStr = `\\frac{${absN}}{${this.d}}`;
                }
                s += valStr;
                if (power > 0) {
                    if (this.d !== 1n) s += " ";
                    s += "n";
                    if (power > 1) s += `^{${power}}`;
                }
                return s;
            }
        }

        let lastGeneratedLaTeX = "";

        function computeAndOutput() {
            const raw = document.getElementById('numsInput').value.trim();
            if (!raw) return;

            const yVals = raw.split(/[#,,]/).map(x => Fraction.parse(x)).filter(x => x !== null);
            const n = yVals.length;
            if (n === 0) return;
            const xVals = Array.from({length: n}, (_, i) => BigInt(i + 1));

            let poly = Array.from({length: n}, () => new Fraction(0n));

            for (let i = 0; i < n; i++) {
                let basis = [new Fraction(1n)];
                let denominator = 1n;
                for (let j = 0; j < n; j++) {
                    if (i === j) continue;
                    denominator *= (xVals[i] - xVals[j]);
                    let nextBasis = Array.from({length: basis.length + 1}, () => new Fraction(0n));
                    const xj = new Fraction(xVals[j]);
                    for (let k = 0; k < basis.length; k++) {
                        nextBasis[k + 1] = nextBasis[k + 1].add(basis[k]);
                        nextBasis[k] = nextBasis[k].sub(basis[k].mul(xj));
                    }
                    basis = nextBasis;
                }
                const scalar = yVals[i].div(new Fraction(denominator));
                for (let k = 0; k < basis.length; k++) {
                    poly[k] = poly[k].add(basis[k].mul(scalar));
                }
            }

            let formulaLaTeX = "";
            let formulaDisplay = "";
            let first = true;

            for (let i = n - 1; i >= 0; i--) {
                const c = poly[i];
                if (c.n === 0n) continue;

                formulaLaTeX += c.toLaTeX(first, i);

                let sDisp = "";
                const absN = c.n < 0n ? -c.n : c.n;
                if (c.n < 0n) sDisp += first ? "-" : " - ";
                else if (!first) sDisp += " + ";

                let valDisp = "";
                if (c.d === 1n) {
                    if (i === 0 || absN !== 1n) valDisp = absN.toString();
                } else {
                    valDisp = `${absN}/${c.d}`; 
                }
                
                sDisp += valDisp;
                if (i > 0) {
                    if (valDisp !== "") sDisp += " "; 
                    sDisp += "n";
                    if (i > 1) sDisp += `^${i}`;
                }
                formulaDisplay += sDisp;
                first = false;
            }

            if (!formulaDisplay) { formulaDisplay = "0"; formulaLaTeX = "0"; }

            const verificationText = yVals.map((v, idx) => `f(${idx + 1}) = ${v.n}${v.d === 1n ? "" : "/" + v.d}`).join(",\n") + ".";
            const verificationLaTeX = yVals.map((v, idx) => `f(${idx + 1}) = ${v.n}${v.d === 1n ? "" : "/" + v.d}`).join(", \\\\\n") + ".";

            lastGeneratedLaTeX = `\\documentclass{article}
\\usepackage{amsmath}
\\usepackage{amssymb}
\\usepackage{mathtools}
\\begin{document}
\\section*{Analytical Solution}
当 $f(n) = ${formulaLaTeX}$ 时:
\\[
\\begin{aligned}
${verificationLaTeX}
\\end{aligned}
\\]
\\end{document}`;

            const box = document.getElementById('result-area');
            box.innerHTML = `当 f(n) = ${formulaDisplay} 时:<br>` + 
                            verificationText.replace(/\n/g, "<br>");
            box.style.display = 'block';
        }

        // ================= 严谨修复: 兼容性复制引擎 =================
        function copyToClipboard() {
            if (!lastGeneratedLaTeX) return;
            
            const text = lastGeneratedLaTeX;
            
            // 优先使用现代 API
            if (navigator.clipboard && window.isSecureContext) {
                navigator.clipboard.writeText(text).then(() => {
                    alert("Complete LaTeX document code copied!");
                }).catch(err => {
                    fallbackCopy(text);
                });
            } else {
                fallbackCopy(text);
            }
        }

        // 终极回退方案: 确保在非 HTTPS 或旧版浏览器中依然有效
        function fallbackCopy(text) {
            const textArea = document.createElement("textarea");
            textArea.value = text;
            textArea.style.position = "fixed"; // 避免页面滚动
            textArea.style.left = "-9999px";
            textArea.style.top = "0";
            document.body.appendChild(textArea);
            textArea.focus();
            textArea.select();
            try {
                document.execCommand('copy');
                alert("Complete LaTeX document code copied!");
            } catch (err) {
                alert("Copy failed. Please manually select the text.");
            }
            document.body.removeChild(textArea);
        }
        // =========================================================

        document.getElementById('numsInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') computeAndOutput();
        });
    </script>
</body>
</html>
